<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HD Action X Web Canvas Test</title>
<style>
html,body{margin:0;background:#07111e;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.note{font-size:13px;color:#cbd5e1;margin:0 0 12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{font-size:15px;padding:9px 12px;border-radius:8px;border:1px solid #789;background:#1c334a;color:#fff}
canvas{width:100%;height:auto;border:1px solid #456;border-radius:10px;display:block;image-rendering:pixelated}
#status{font-size:13px;color:#9fe3b1;margin-top:8px}
</style>
</head>
<body><main>
<h1>HD Action X / Web Canvas Test</h1>
<p class="note">外部PNG hero.png をHTTP(S)で読み込み、Canvasへ直接 drawImage。補間OFF。</p>
<div class="controls">
<button data-s=".22">ゲーム小</button>
<button data-s=".35">ゲーム中</button>
<button data-s=".50">ゲーム大</button>
<button id="bg">背景切替</button>
</div>
<canvas id="game" width="900" height="600"></canvas>
<div id="status">hero.png loading...</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
let scale=.35,bg=0;
const img=new Image();
img.src='./hero.png';

function scene(){
  const colors=['#10243b','#ffffff','#000000'];
  ctx.fillStyle=colors[bg]; ctx.fillRect(0,0,c.width,c.height);
  if(bg===0){
    ctx.fillStyle='#263b4e';ctx.fillRect(0,500,c.width,100);
    ctx.fillStyle='#4e7998';
    for(let i=0;i<c.width;i+=72)ctx.fillRect(i,500,66,8);
  }
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  scene();
  const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
  const x=Math.round((c.width-w)/2),y=500-h;
  ctx.drawImage(img,x,y,w,h);
  document.getElementById('status').textContent =
   `OK / source ${img.naturalWidth}×${img.naturalHeight} / display ${w}×${h} / smoothing OFF`;
}
img.onload=draw;
img.onerror=()=>document.getElementById('status').textContent='ERROR: hero.png could not be loaded';

document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{scale=Number(b.dataset.s);draw()});
document.getElementById('bg').onclick=()=>{bg=(bg+1)%3;draw()};
</script>
</main></body></html>
