<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD Action X Bone Editor</title><style>
*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;background:#101827;color:#f0f6ff;font:14px system-ui}header{padding:14px;background:#1c2c40;font-weight:bold}.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:9px}button,.pick{border:1px solid #53758f;background:#29465e;color:white;border-radius:8px;padding:10px;font:inherit;cursor:pointer}button.on{background:#087e8b}.pick input{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.box{min-width:0;background:#273749;border-radius:8px;overflow:hidden}.label{padding:8px;font-weight:bold;font-size:12px}.stage{background:white;touch-action:none}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px}#status{padding:10px;color:#bfe7f5;min-height:40px}.dpad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;justify-content:center;padding:8px}.dpad button{font-size:24px;min-height:49px;touch-action:manipulation}.nudge{margin:8px;border:1px solid #45627a;border-radius:10px;padding:8px}.nudgehead{text-align:center;font-weight:bold}.nudgeopts{display:flex;justify-content:center;align-items:center;gap:8px}footer{padding:10px;color:#b9c9d8;font-size:12px}</style></head><body>
<header>HD Action X | 骨格エディター v2.2</header>
<div class="toolbar"><label class="pick">📷 原本画像を選択<input id="file" type="file" accept="image/*"></label><button id="add">＋関節</button><button id="join">🔗 接続</button><button id="move" class="on">✋ 移動</button><button id="delete">🗑 削除</button><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button></div>
<div class="settings">線色 <input id="color" type="color" value="#2788ee"> 太さ <input id="thick" type="range" min="1" max="12" value="3"><label><input id="show" type="checkbox" checked>関節点</label></div>
<div class="row"><div class="box"><div class="label">ORIGINAL | 原本</div><div class="stage"><canvas id="left" width="400" height="600"></canvas></div></div><div class="box"><div class="label">EDIT | 骨格編集</div><div class="stage"><canvas id="right" width="400" height="600"></canvas></div></div></div>
<div class="nudge"><div class="nudgehead">🎯 関節の微調整（移動モードで丸をタップして選択）</div><div class="nudgeopts">移動幅 <select id="step"><option value="1">1px</option><option value="5">5px</option><option value="10">10px</option></select> <span id="selectedName">未選択</span></div><div class="dpad"><span></span><button data-dx="0" data-dy="-1" aria-label="上">▲</button><span></span><button data-dx="-1" data-dy="0" aria-label="左">◀</button><button id="clearSelection" aria-label="選択解除">●</button><button data-dx="1" data-dy="0" aria-label="右">▶</button><span></span><button data-dx="0" data-dy="1" aria-label="下">▼</button><span></span></div></div><div id="status">準備OK。写真を選んでね。</div><div class="toolbar"><button id="plus">＋拡大</button><button id="minus">－縮小</button><button id="reset">表示リセット</button><button id="lockImage" class="on" aria-pressed="true">🔒 画像固定</button><button id="save">💾 編集データ保存</button><label class="pick">📂 編集データ読込<input id="json" type="file" accept=".json,application/json"></label><button id="export">🖼 PNG出力</button></div>
<footer>＋関節で右画像をタップして点を追加。接続で2点を順にタップ。移動で点をタップして選択し、十字キーで1pxずつ微調整。ドラッグでも線が追従。「↔️ 画像移動」に切り替えると空白ドラッグで背景を移動。🔒固定中は背景を動かさない。画像はサーバーに送信しない。</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),L=$('left'),R=$('right'),lc=L.getContext('2d'),rc=R.getContext('2d');let imageLocked=true,selectedId=null;let im=null,imageData=null,pts=[],lines=[],mode='move',first=null,drag=null,pan=null,zoom=1,offset={x:0,y:0},past=[],future=[],id=0;const status=s=>$('status').textContent=s;
function state(){return JSON.stringify({pts,lines,id})}function record(){past.push(state());if(past.length>120)past.shift();future=[]}function restore(s){let d=JSON.parse(s);pts=d.pts;lines=d.lines;id=d.id;first=null;if(!pts.some(p=>p.id===selectedId))selectedId=null;updateSelection();draw()}
function modeSet(m){mode=m;first=null;['add','join','move','delete'].forEach(k=>$(k).classList.toggle('on',k===m));status(({add:'右画像をタップして関節を追加',join:'接続する2点を順番にタップ',move:'関節をドラッグして移動',delete:'削除する点か線をタップ'})[m])}['add','join','move','delete'].forEach(k=>$(k).onclick=()=>modeSet(k));
function updateSelection(){let p=pts.find(p=>p.id===selectedId);$('selectedName').textContent=p?'選択中: 関節 '+p.id:'未選択'}function paint(ctx){ctx.fillStyle='white';ctx.fillRect(0,0,L.width,L.height);if(im)ctx.drawImage(im,0,0,L.width,L.height)}
function draw(){lc.setTransform(1,0,0,1,0,0);rc.setTransform(1,0,0,1,0,0);paint(lc);rc.clearRect(0,0,R.width,R.height);rc.save();rc.setTransform(zoom,0,0,zoom,offset.x,offset.y);paint(rc);for(const e of lines){let a=pts.find(p=>p.id===e.a),b=pts.find(p=>p.id===e.b);if(!a||!b)continue;rc.beginPath();rc.moveTo(a.x,a.y);rc.lineTo(b.x,b.y);rc.lineWidth=e.width;rc.strokeStyle=e.color;rc.stroke()}if($('show').checked)for(const p of pts){rc.beginPath();rc.arc(p.x,p.y,Math.max(4,R.width*.012),0,Math.PI*2);rc.fillStyle=p.id===first||p.id===selectedId?'#ffdf28':'white';rc.fill();rc.lineWidth=2;rc.strokeStyle=p.color;rc.stroke()}rc.restore()}
function fit(){let w=im?.naturalWidth||400,h=im?.naturalHeight||600,f=Math.min(1,2048/Math.max(w,h));w=Math.round(w*f);h=Math.round(h*f);for(let c of [L,R]){c.width=w;c.height=h}draw()}
function point(ev){let r=R.getBoundingClientRect();return{x:((ev.clientX-r.left)*R.width/r.width-offset.x)/zoom,y:((ev.clientY-r.top)*R.height/r.height-offset.y)/zoom}}
function hit(p){return [...pts].reverse().find(q=>Math.hypot(p.x-q.x,p.y-q.y)<Math.max(12,R.width*.03)/zoom)}
function dist(p,e){let a=pts.find(q=>q.id===e.a),b=pts.find(q=>q.id===e.b);if(!a||!b)return Infinity;let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
R.addEventListener('pointerdown',ev=>{ev.preventDefault();R.setPointerCapture(ev.pointerId);let p=point(ev),q=hit(p);if(mode==='add'){record();pts.push({id:++id,x:p.x,y:p.y,color:$('color').value});selectedId=id;updateSelection();draw();return}if(mode==='join'){if(!q)return;if(first===null)first=q.id;else{if(first!==q.id&&!lines.some(e=>e.a===first&&e.b===q.id||e.b===first&&e.a===q.id)){record();lines.push({a:first,b:q.id,color:$('color').value,width:+$('thick').value})}first=null}draw();return}if(mode==='delete'){if(q){record();if(selectedId===q.id){selectedId=null;updateSelection()}pts=pts.filter(z=>z.id!==q.id);lines=lines.filter(e=>e.a!==q.id&&e.b!==q.id)}else{let e=lines.find(e=>dist(p,e)<12/zoom);if(e){record();lines=lines.filter(z=>z!==e)}}draw();return}if(q){selectedId=q.id;updateSelection();record();drag={q,x:q.x,y:q.y,moved:false};draw()}else if(!imageLocked)pan={x:ev.clientX,y:ev.clientY,ox:offset.x,oy:offset.y}});
R.addEventListener('pointermove',ev=>{if(drag){let p=point(ev);drag.q.x=p.x;drag.q.y=p.y;drag.moved=true;draw()}else if(pan){let r=R.getBoundingClientRect();offset.x=pan.ox+(ev.clientX-pan.x)*R.width/r.width;offset.y=pan.oy+(ev.clientY-pan.y)*R.height/r.height;draw()}});function end(){if(drag&&!drag.moved)past.pop();drag=null;pan=null}R.addEventListener('pointerup',end);R.addEventListener('pointercancel',end);
document.querySelectorAll('[data-dx]').forEach(btn=>btn.addEventListener('click',()=>{let p=pts.find(p=>p.id===selectedId);if(!p){status('まず移動モードで関節の丸をタップしてね');return}let step=Number($('step').value);record();p.x+=Number(btn.dataset.dx)*step;p.y+=Number(btn.dataset.dy)*step;draw();status('関節 '+p.id+' を '+step+'px 移動したよ')}));$('clearSelection').onclick=()=>{selectedId=null;updateSelection();draw()};$('lockImage').onclick=()=>{imageLocked=!imageLocked;$('lockImage').classList.toggle('on',imageLocked);$('lockImage').setAttribute('aria-pressed',String(imageLocked));$('lockImage').textContent=imageLocked?'🔒 画像固定':'↔️ 画像移動';status(imageLocked?'画像固定中：背景は動かず、関節点は編集できるよ':'画像移動中：右画面の空白をドラッグして背景を移動。関節点はそのまま編集可能')};$('undo').onclick=()=>{if(past.length){future.push(state());restore(past.pop())}};$('redo').onclick=()=>{if(future.length){past.push(state());restore(future.pop())}};$('show').onchange=draw;
function changeZoom(f){let x=R.width/2,y=R.height/2,z=Math.max(1,Math.min(8,zoom*f));offset.x=x-(x-offset.x)*z/zoom;offset.y=y-(y-offset.y)*z/zoom;zoom=z;if(z===1)offset={x:0,y:0};draw()}$('plus').onclick=()=>changeZoom(1.5);$('minus').onclick=()=>changeZoom(1/1.5);$('reset').onclick=()=>{zoom=1;offset={x:0,y:0};draw()};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
$('file').addEventListener('change',ev=>{let file=ev.target.files?.[0];if(!file){status('画像が未選択');return}status('選択イベントOK: '+file.name+' / 読込中');let reader=new FileReader();reader.onerror=()=>status('FileReaderエラー: '+reader.error?.message);reader.onload=()=>{status('ファイル取得OK / 画像デコード中');let image=new Image();image.onerror=()=>status('画像デコード失敗。JPEGかPNGを試してね');image.onload=()=>{try{im=image;imageData=reader.result;pts=[];lines=[];selectedId=null;updateSelection();past=[];future=[];zoom=1;offset={x:0,y:0};fit();status('画像読込成功: '+image.naturalWidth+'×'+image.naturalHeight+'px')}catch(e){status('描画エラー: '+e.message)}};image.src=reader.result};reader.readAsDataURL(file);ev.target.value=''});
$('save').onclick=()=>download(new Blob([JSON.stringify({version:2,image:imageData,pts,lines,id})],{type:'application/json'}),'HD_Action_X_bones.json');
$('json').onchange=ev=>{let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.pts)||!Array.isArray(d.lines))throw Error('形式が違う');let apply=()=>{pts=d.pts;lines=d.lines;selectedId=null;updateSelection();id=d.id||pts.length;past=[];future=[];zoom=1;offset={x:0,y:0};fit();status('編集データ読込成功')};if(d.image){let image=new Image();image.onload=()=>{im=image;imageData=d.image;apply()};image.onerror=()=>status('保存画像が破損');image.src=d.image}else apply()}catch(e){status('JSONエラー: '+e.message)}};r.readAsText(f)};
$('export').onclick=()=>{if(!im){status('画像を先に選択してね');return}let z=zoom,o={...offset};zoom=1;offset={x:0,y:0};draw();R.toBlob(blob=>{if(blob)download(blob,'HD_Action_X_bones.png');zoom=z;offset=o;draw()},'image/png')};fit();})();
</script></body></html>
